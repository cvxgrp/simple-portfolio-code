[project]
name = "simple-portfolio-code"
version = "0.1.0"
description = "Code certificate for the simple portfolio paper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cvxpy==1.8.2",
    "fredapi==0.5.2",
    "matplotlib==3.10.9",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "pyarrow==24.0.0",
    "scipy==1.17.1",
    "tqdm==4.67.3",
    "yfinance==1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_portfolio"]
